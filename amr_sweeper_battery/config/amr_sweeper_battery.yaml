/**:
  ros__parameters:
    # -- CAN transport --------------------------------------------------------
    can_interface:                   can0  # SocketCAN interface that carries Daly BMS frames.
    timer_period:                    15.0  # Polling period in seconds for periodic BMS requests and status publication.
    priority:                        24    # 29-bit CAN arbitration priority byte used for PC-to-BMS requests.
    bms_address:                     1     # Daly BMS node address byte used in request IDs.
    pc_address:                      64    # Host/controller node address byte used in request IDs.

    # -- Error escalation -----------------------------------------------------
    retry_attempts_before_error:     3     # Consecutive CAN failures before warnings escalate to errors.
    fatal_after_consecutive_errors:  10    # Consecutive CAN failures before the node stops retrying.
    max_reconnect_attempts:          10    # Hard cap on reconnect attempts. Set to 0 for unlimited retries.

    # -- Battery protection ---------------------------------------------------
    protection:
      safety_stop_topic_name:        safety_msgs/stop    # Shared stop topic used when battery protection thresholds are exceeded.
      safety_stop_sender_name:       battery_node        # Sender label attached to published SafetyStop messages.

      over_voltage:
        enabled:                     true                # Publishes a SafetyStop if pack voltage rises above the configured threshold.
        threshold:                   46.0                # Maximum allowed pack voltage.
        units:                       "V"                 # Units for the over-voltage threshold.

      under_voltage:
        enabled:                     true                # Publishes a SafetyStop if pack voltage drops below the configured threshold.
        threshold:                   33.0                # Minimum allowed pack voltage.
        units:                       "V"                 # Units for the under-voltage threshold.

      # -- Charging protection -----------------------------------------------
      charging:
        over_current:
          enabled:                   true                # Publishes a SafetyStop if charging current rises above the configured limit.
          threshold:                 7.0                 # Maximum allowed charging current.
          units:                     "A"                 # Units for the charging over-current threshold.

        under_current:
          enabled:                   false               # Publishes a SafetyStop if charging current falls below the configured minimum while charging.
          threshold:                  5.0                # Minimum charging current considered valid while in charging mode.
          units:                     "A"                 # Units for the charging under-current threshold.

        over_temperature:
          enabled:                   true                # Publishes a SafetyStop if the hottest reported battery temperature exceeds the charging limit.
          threshold:                 45.0                # Maximum allowed battery temperature while charging.
          units:                     "degC"              # Units for the charging over-temperature threshold.

        under_temperature:
          enabled:                   true                # Publishes a SafetyStop if the coldest reported battery temperature falls below the charging limit.
          threshold:                  0.0                # Minimum allowed battery temperature while charging.
          units:                     "degC"              # Units for the charging under-temperature threshold.

      # -- Discharging protection --------------------------------------------
      discharging:
        over_current:
          enabled:                   true                # Publishes a SafetyStop if discharge current becomes more negative than the configured threshold.
          threshold:                -15.0                # Maximum allowed discharge current.
          units:                     "A"                 # Units for the discharging over-current threshold.

        under_current:
          enabled:                   false               # Publishes a SafetyStop if discharge current rises above the configured minimum while discharging.
          threshold:                 -5.0                # Minimum discharge current considered valid while in discharging mode.
          units:                     "A"                 # Units for the discharging under-current threshold.

        over_temperature:
          enabled:                   true                # Publishes a SafetyStop if the hottest reported battery temperature exceeds the discharging limit.
          threshold:                 60.0                # Maximum allowed battery temperature while discharging.
          units:                     "degC"              # Units for the discharging over-temperature threshold.

        under_temperature:
          enabled:                   true                # Publishes a SafetyStop if the coldest reported battery temperature falls below the discharging limit.
          threshold:                 -20.0               # Minimum allowed battery temperature while discharging.
          units:                     "degC"              # Units for the discharging under-temperature threshold.
