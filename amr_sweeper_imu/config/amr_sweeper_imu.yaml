/**:
  ros__parameters:
    device_path:                    /dev/serial/by-id/usb-1a86_USB_Serial-if00-port0  # Stable by-id path for the JY901 IMU on the robot.
    baud:                           115200        # Serial baud rate. Supported: 9600/19200/38400/57600/115200.
    imu_frame_id:                   imu_link      # Frame ID stamped on published IMU messages.
    publish_hz:                     50.0          # Target IMU output rate in Hz and matching ROS publish cap after valid frames are parsed.

    # -- Serial supervision ----------------------------------------------------
    read_period_ms:                 2             # Serial polling period in milliseconds. Lower values retry reads more aggressively.
    reconnect_attempt_interval_ms:  1000          # Delay between reopen attempts after a serial failure.
    retry_attempts_before_error:    3             # Consecutive failures allowed before WARN escalates to ERROR.
    fatal_after_consecutive_errors: 10            # Consecutive failures allowed before the node escalates to FATAL and stops retrying.
    max_reconnect_attempts:         10            # Hard cap on reconnect attempts. Set to 0 for unlimited retries.

    # -- Device configuration --------------------------------------------------
    configure_device_on_startup:    true          # Program the JY901 registers from the configured parameters after connecting.
    save_configuration:             true          # Send the SAVE command after programming registers so changes persist across power cycles.
    installation_direction:         horizontal    # JY901 installation direction register: horizontal or vertical.
    algorithm_mode:                 nine_axis     # JY901 fusion mode: nine_axis or six_axis.
    gyroscope_auto_calibration:     true          # JY901 command 0x63. true sends 0 (enabled), false sends 1 (disabled). The local datasheet documents this as a command, not a readable persistent register.
    led_enabled:                    false         # Leave the onboard LED enabled.

    # -- Packet outputs --------------------------------------------------------
    output_time:                    false         # Enable 0x50 time packets from the JY901.
    output_acceleration:            true          # Enable 0x51 acceleration packets required by this driver.
    output_angular_velocity:        true          # Enable 0x52 angular-velocity packets required by this driver.
    output_angle:                   true          # Keep 0x53 angle packets enabled for debugging and comparison.
    output_magnetic:                false         # Enable 0x54 magnetic-field packets.
    output_port_status:             false         # Enable 0x55 port-status packets.
    output_pressure_height:         false         # Enable 0x56 pressure/height packets.
    output_gps_coordinates:         false         # Enable 0x57 longitude/latitude packets.
    output_gps_velocity:            false         # Enable 0x58 GPS speed packets.
    output_quaternion:              true          # Enable 0x59 quaternion packets and use them as the primary ROS orientation source.
    output_satellite_accuracy:      false         # Enable 0x5A satellite-position-accuracy packets.

    # -- Software mounting correction ------------------------------------------
    yaw_offset_deg:                 180.0         # Extra yaw rotation applied before publishing orientation, gyro, and accel outputs. Large offsets can mask a startup-zero yaw as a clean cardinal heading.

    # -- Output covariances ----------------------------------------------------
    orientation_covariance:         [0.2, 0.0, 0.0, 0.0, 0.2, 0.0, 0.0, 0.0, 0.01]    # Row-major 3x3 covariance for the driver-provided orientation.
    angular_velocity_covariance:    [0.02, 0.0, 0.0, 0.0, 0.02, 0.0, 0.0, 0.0, 0.01]  # Row-major 3x3 covariance for gyro output in rad^2/s^2.
    linear_acceleration_covariance: [0.5, 0.0, 0.0, 0.0, 0.5, 0.0, 0.0, 0.0, 0.5]     # Row-major 3x3 covariance for accelerometer output in (m/s^2)^2.

# -- Device fallback configuration --------------------------------------------------
    fallback_baud:                  9600          # Baud used as the fallback serial connection when the preferred baud does not respond.
    fallback_rate_hz:               10.0          # Fallback JY901 output rate written to the RATE register if the preferred publish_hz profile cannot be confirmed.
    
