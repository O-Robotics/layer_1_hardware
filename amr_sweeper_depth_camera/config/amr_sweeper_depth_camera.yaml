/**:
  ros__parameters:
    serial_no:                       ""            # Leave empty to auto-select the detected D555.
    enable_color:                    true
    rgb_camera.color_profile:        896x504x30
    rgb_camera.color_format:         RGB8
    rgb_camera.global_time_enabled:  false

    enable_depth:                    true
    depth_module.depth_profile:      896x504x30
    depth_module.depth_format:       Z16
    depth_module.global_time_enabled: false

    enable_infra1:                   false
    enable_infra2:                   false
    depth_module.infra_profile:      896x504x30
    depth_module.infra1_format:      Y8
    depth_module.infra2_format:      Y8

    enable_motion:                   true          # D555 DDS devices expose combined IMU samples on ~/motion/sample.
    enable_accel:                    false
    enable_gyro:                     false
    motion_fps:                      100
    motion_module.global_time_enabled: false

    enable_sync:                     false
    pointcloud.enable:               true
    pointcloud.stream_filter:        2
    pointcloud.stream_index_filter:  0
    align_depth.enable:              false

    hold_back_imu_for_frames:        false
    publish_tf:                      false
    tf_publish_rate:                 0.0
