/**:
  ros__parameters:
    camera_name: depth_camera          # Driver node name for the AMR Sweeper depth camera.
    device_type: D555                  # Prefer the RealSense D555 device when multiple RealSense cameras are present.
    serial_no: ""                      # Optional serial number selector. Leave empty to use the first matching D555.
    usb_port_id: ""                    # Optional port selector. Leave empty unless the deployment needs a fixed port binding.

    # -- Time and diagnostics -------------------------------------------------
    diagnostics_period: 0.0            # Disable periodic diagnostics publishing unless explicitly needed.
    wait_for_device_timeout: -1.0      # Wait indefinitely for the PoE camera to appear.
    reconnect_timeout: 6.0             # Seconds between reconnect attempts if the camera disconnects.

    # -- TF / frame model -----------------------------------------------------
    base_frame_id: depth_camera_link   # Root frame anchored in the AMR Sweeper robot description.
    publish_tf: false                  # Robot description already provides the depth camera TF tree.
    tf_publish_rate: 0.0               # Keep dynamic TF publishing disabled when publish_tf is false.
    tf_prefix: ""                      # No additional frame prefix on top of the robot description frames.

    # -- Depth stream ---------------------------------------------------------
    enable_depth: true
    depth_module.depth_profile: 1280x720x15  # Balanced profile for forward obstacle detection on the D555.
    depth_module.depth_format: Z16
    depth_module.enable_auto_exposure: true

    # -- Color stream ---------------------------------------------------------
    enable_color: true                # For teleoperation through Foxglove
    rgb_camera.color_profile: 448x252x5
    rgb_camera.color_format: RGB8
    rgb_camera.enable_auto_exposure: true

    # -- Infrared streams ----------------------------------------------------
    enable_infra: false               # Keep infrared image topics disabled unless a downstream consumer needs them.
    enable_infra1: false
    enable_infra2: false

    # -- IMU ------------------------------------------------------------------
    enable_gyro: false                # AMR Sweeper already has a dedicated IMU package.
    enable_accel: false
    unite_imu_method: 0               # Do not publish the fused IMU topic when gyro/accel are disabled.
    gyro_fps: 200
    accel_fps: 100

    # -- Processing -----------------------------------------------------------
    enable_sync: true                  # Time-synchronize depth and color streams inside the driver.
    align_depth.enable: false          # Keep raw depth as the source for depthimage_to_laserscan.
    pointcloud.enable: false           # The sweeper stack currently consumes LaserScan rather than PointCloud2.
    colorizer.enable: false
    decimation_filter.enable: false
    spatial_filter.enable: false
    temporal_filter.enable: false
    hole_filling_filter.enable: false

    # -- Optional D500 safety features ---------------------------------------
    enable_safety: false               # Launch the standard depth pipeline only; safety interfaces stay disabled by default.
