/**:
  ros__parameters:
    # -- Topic health ---------------------------------------------------------
    stale_data_timeout_sec:         8.0   # Maximum silence before a stream is treated as stale, in seconds; default: 8.0.
    startup_grace_sec:              12.0  # Startup grace period before missing topics count as failures, in seconds; default: 12.0.
    monitor_depth_image:            true  # Monitor the bridged depth image stream.
    monitor_depth_camera_info:      true  # Monitor the bridged depth camera info stream.
    monitor_color_image:            true  # Monitor the bridged color image stream.
    monitor_color_camera_info:      true  # Monitor the bridged color camera info stream.
    monitor_color_compressed:       true  # Monitor the bridged compressed color image stream.
    monitor_infra1_image:           true  # Monitor the bridged infrared-1 image stream.
    monitor_infra1_camera_info:     true  # Monitor the bridged infrared-1 camera info stream.
    monitor_infra2_image:           true  # Monitor the bridged infrared-2 image stream.
    monitor_infra2_camera_info:     true  # Monitor the bridged infrared-2 camera info stream.
    monitor_motion_imu:             true  # Monitor the bridged motion IMU stream.

    # -- Escalation -----------------------------------------------------------
    reconnect_attempt_interval_ms:  1000  # Watchdog polling period in milliseconds; default: 1000.
    retry_attempts_before_error:    3     # Consecutive full outages before logging at ERROR; default: 3.
    fatal_after_consecutive_errors: 10    # Consecutive full outages before escalating to FATAL; default: 10.
    max_reconnect_attempts:         10    # Hard full-outage reconnect-attempt ceiling before FATAL; default: 10.
