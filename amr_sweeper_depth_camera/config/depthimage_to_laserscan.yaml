/**:
  ros__parameters:
    # -- Scan geometry --------------------------------------------------------
    output_frame: depth_camera_link  # Publish the LaserScan in the camera body frame instead of the optical frame.
    scan_height:  5                  # Number of image rows sampled symmetrically around the optical center line.

    # -- Range filtering ------------------------------------------------------
    range_min:    0.20               # Ignore returns closer than the camera's reliable near field.
    range_max:    3.0                # Ignore returns beyond the useful obstacle-detection range.

    # -- Timing ---------------------------------------------------------------
    scan_time:    0.050              # Approximate scan period in seconds for a 20 Hz depth stream.
