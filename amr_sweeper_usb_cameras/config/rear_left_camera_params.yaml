# rear_left_camera capture settings and calibration mapping.
/**:
  ros__parameters:
    # -- Capture device -------------------------------------------------------
    video_device: /dev/video2  # V4L2 device path for the rear-left USB camera.
    framerate:    2.5          # Requested capture rate in frames per second.

    # -- Image identity -------------------------------------------------------
    frame_id:      rear_left_camera_optical_frame  # Optical frame stamped on published images.
    image_width:   320                             # Captured image width in pixels.
    image_height:  240                             # Captured image height in pixels.
    camera_name:   rear_left_camera                # Camera name embedded in CameraInfo output.

    # -- Calibration ----------------------------------------------------------
    camera_info_url: package://amr_sweeper_usb_cameras/config/rear_left_camera_info.yaml  # Calibration file loaded by the driver.
