/**:
  ros__parameters:
    # -- Motor interface -------------------------------------------------------
    can_interface:                    can0    # SocketCAN interface used by the ODrive wheel controller.
    left_motor_id:                    0       # ODrive node ID for the left wheel motor.
    right_motor_id:                   2       # ODrive node ID for the right wheel motor.
    left_motor_positive_direction:    CCW     # Positive motor rotation direction for the left wheel joint.
    right_motor_positive_direction:   CW      # Positive motor rotation direction for the right wheel joint.
    gear_ratio:                       50.0    # Shared gearbox ratio from wheel joint to motor shaft.
    reconnect_attempt_interval_ms:   1000    # Delay between SocketCAN reopen attempts after a disconnect.
    retry_attempts_before_error:     3       # Consecutive CAN failures before warnings escalate to errors.
    fatal_after_consecutive_errors:  10      # Consecutive CAN failures before the hardware interface goes fatal.
    max_reconnect_attempts:          10      # Hard cap on reconnect attempts. Set to 0 for unlimited retries.

    # -- Protection configuration ----------------------------------------------
    protection:
      enabled:                        false   # Master enable for software motor protection and fault latching.
      clear_faults_on_activate:       true    # Clears latched faults when the hardware interface is activated.
      latch_faults:                   true    # Keeps a tripped protection active until an explicit recovery step.
      startup_ignore_ms:              500     # Grace period before protection checks begin after startup.
      command_deadband_for_checks:    0.0     # Optional minimum commanded speed before motion-based checks apply.

      defaults:
        over_torque:
          enabled:                    false   # Uses ODrive torque estimate when protection support is implemented.
          threshold:                  5.0     # Default torque threshold.
          units:                      "Nm"    # Torque units for ODrive protection thresholds.
          trip_duration_ms:           100     # Time above threshold required before latching.
        over_speed:
          enabled:                    false   # Uses ODrive velocity feedback when protection support is implemented.
          threshold:                  20.0    # Default wheel speed threshold.
          units:                      "rad/s" # Speed units for ODrive protection thresholds.
          trip_duration_ms:           100     # Time above threshold required before latching.
        over_temperature:
          enabled:                    false   # Uses ODrive temperature telemetry when protection support is implemented.
          threshold:                  80.0    # Default motor/controller temperature threshold.
          units:                      "degC"  # Temperature units for ODrive protection thresholds.
          trip_duration_ms:           500     # Longer debounce for temperature faults.
        over_current:
          enabled:                    false   # Uses ODrive current telemetry when protection support is implemented.
          threshold:                  5.0     # Default current threshold.
          units:                      "A"     # Current units for ODrive protection thresholds.
          trip_duration_ms:           100     # Time above threshold required before latching.
        over_voltage:
          enabled:                    false   # Uses ODrive bus voltage telemetry when protection support is implemented.
          threshold:                  50.0    # Default DC bus voltage threshold.
          units:                      "V"     # Voltage units for ODrive protection thresholds.
          trip_duration_ms:           100     # Time above threshold required before latching.

      joint_overrides:                {}      # Optional per-joint overrides keyed by ros2_control joint name.
